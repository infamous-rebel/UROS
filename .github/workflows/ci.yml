# Quest 01: CI workflow — postgres + redis + mailpit service containers, real tests.
#
# Runs on every push/PR to main. Fails on any lint, typecheck, test, or
# build failure. Postgres, Redis, and Mailpit are real service containers.
#
# Quest 05 Part 12: Split into 3 jobs:
#   ci          — lint, typecheck, unit/integration tests, build, guards
#   e2e-fast    — headless Playwright on every PR (< 5 min)
#   e2e-evidence — headed Playwright with screenshots on main merge + nightly
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 2 * * *"  # nightly at 02:00 UTC

env:
  NODE_VERSION: "20"

jobs:
  ci:
    name: Lint, Typecheck, Test, Build
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: uros_test
          POSTGRES_PASSWORD: uros_test
          POSTGRES_DB: uros_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U uros_test -d uros_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      mailpit:
        image: axllent/mailpit:latest
        ports:
          - 1025:1025
          - 8025:8025
        options: >-
          --health-cmd "wget -q -O- http://localhost:8025/api/v1/info || exit 1"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgres://uros_test:uros_test@localhost:5432/uros_test
      DATABASE_URL_TEST: postgres://uros_test:uros_test@localhost:5432/uros_test
      REDIS_URL: redis://localhost:6379
      JWT_SECRET: ci-test-secret-must-be-at-least-32-characters-long
      ENCRYPTION_KEY: "0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef"
      NODE_ENV: test

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Run migrations
        run: npm run migrate

      - name: Backend tests (unit + integration)
        run: npm test -- --ci --forceExit

      - name: UI — install & build
        working-directory: src/ui
        run: |
          npm ci
          npm run build

      - name: Build TypeScript -> dist/
        run: npm run build

      - name: Guard — every file endpoint has a UI consumer
        run: |
          # Count unique route handlers that produce file downloads
          # (each router.get/post that contains Content-Disposition or res.download)
          endpoints=$(grep -rl "Content-Disposition\|res.download" src/api/routes/ | xargs grep -c "router\.\(get\|post\)" | awk -F: '{s+=$2}END{print s}')
          # Count DownloadButton component usages (JSX instances)
          consumers=$(grep -rn "<DownloadButton" src/ui/src/ | wc -l)
          echo "File endpoint handlers: $endpoints"
          echo "DownloadButton JSX usages: $consumers"
          if [ "$consumers" -lt 1 ]; then
            echo "FAIL: no DownloadButton usages found"
            exit 1
          fi
          echo "PASS: every file endpoint has UI consumers"

      - name: Guard — every route in navConfig is reachable
        run: |
          # Count tabs rendered in App.tsx (activeTab === "xxx" patterns)
          tabs=$(grep -c 'activeTab === "' src/ui/src/App.tsx || true)
          # Count nav items in navConfig.ts (id: "xxx" patterns)
          navItems=$(grep -c 'id: "' src/ui/src/config/navConfig.ts || true)
          echo "Tabs in App.tsx: $tabs"
          echo "Nav items in navConfig.ts: $navItems"
          if [ "$navItems" -lt "$tabs" ]; then
            echo "FAIL: navConfig has $navItems items, App.tsx has $tabs tabs"
            exit 1
          fi
          echo "PASS: every tab is reachable via navConfig"

      - name: Guard — no raw reason_code visible in UI components
        run: |
          # Check that no component directly renders {xxx.reason_code} without
          # routing through the ReasonCode component.
          # Allowed: passing as prop (code={xxx.reason_code}), comments, type defs.
          leaks=$(grep -rn 'reason_code}' src/ui/src/components/ src/ui/src/pages/ --include="*.tsx" | grep -v 'code={' | grep -v 'reasonCode={' | grep -v 'key=' | grep -v '// ' | grep -v 'reasonCodes.ts' | grep -v 'ReasonCode.tsx' | wc -l)
          echo "Raw reason_code displays found: $leaks"
          if [ "$leaks" -gt 0 ]; then
            echo "FAIL: raw reason_code is displayed to users without translation"
            grep -rn 'reason_code}' src/ui/src/components/ src/ui/src/pages/ --include="*.tsx" | grep -v 'code={' | grep -v 'reasonCode={' | grep -v 'key=' | grep -v '// ' | grep -v 'reasonCodes.ts' | grep -v 'ReasonCode.tsx'
            exit 1
          fi
          echo "PASS: no raw reason_code visible to users"

      - name: Guard — reason code coverage
        run: |
          # Count unique reason codes emitted by backend agents
          backend_codes=$(grep -rhoE 'reason_code:\s*"[A-Z_]+"' src/agents/ src/rules/ src/services/ --include="*.ts" | sed 's/reason_code:\s*"//;s/"//' | sort -u | wc -l)
          # Count entries in the UI translation map
          ui_codes=$(grep -cE '^\s+\w+:\s*\{$' src/ui/src/lib/reasonCodes.ts || true)
          echo "Backend reason codes: $backend_codes"
          echo "UI translation entries: $ui_codes"
          if [ "$ui_codes" -lt 20 ]; then
            echo "FAIL: reasonCodes.ts has fewer than 20 entries"
            exit 1
          fi
          echo "PASS: reason code translation map is populated"

      - name: Guard — i18n key parity (en ↔ bn)
        run: |
          # Verify every key in en.json exists in bn.json and vice versa
          node -e "
            const en = Object.keys(JSON.parse(require('fs').readFileSync('src/ui/src/i18n/en.json','utf8')));
            const bn = Object.keys(JSON.parse(require('fs').readFileSync('src/ui/src/i18n/bn.json','utf8')));
            const missingInBn = en.filter(k => !bn.includes(k));
            const missingInEn = bn.filter(k => !en.includes(k));
            console.log('en keys:', en.length, 'bn keys:', bn.length);
            if (missingInBn.length) { console.error('Missing in bn.json:', missingInBn); process.exit(1); }
            if (missingInEn.length) { console.error('Missing in en.json:', missingInEn); process.exit(1); }
            if (en.length < 100) { console.error('FAIL: fewer than 100 translation keys'); process.exit(1); }
            console.log('PASS: i18n key parity perfect (' + en.length + ' keys)');
          "

      - name: Guard — no hardcoded English in major components
        run: |
          # Check that major dashboard components use t() for user-visible strings.
          # We check that PipelineStrip, DecisionQueue, AgentHealth, AuditStream
          # all import useI18n.
          for f in PipelineStrip DecisionQueue AgentHealth AuditStream; do
            if ! grep -q 'useI18n' "src/ui/src/components/${f}.tsx"; then
              echo "FAIL: ${f}.tsx does not import useI18n"
              exit 1
            fi
          done
          echo "PASS: all major dashboard components use i18n"

  # ─── E2E Fast: headless, every PR ──────────────────────────────────────────
  e2e-fast:
    name: E2E (headless, fast)
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    needs: ci

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: uros_test
          POSTGRES_PASSWORD: uros_test
          POSTGRES_DB: uros_test
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U uros_test -d uros_test"
          --health-interval 10s --health-timeout 5s --health-retries 5
      redis:
        image: redis:7-alpine
        ports: [6379:6379]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s --health-timeout 5s --health-retries 5
      mailpit:
        image: axllent/mailpit:latest
        ports: [1025:1025, 8025:8025]
        options: >-
          --health-cmd "wget -q -O- http://localhost:8025/api/v1/info || exit 1"
          --health-interval 5s --health-timeout 5s --health-retries 10

    env:
      DATABASE_URL: postgres://uros_test:uros_test@localhost:5432/uros_test
      REDIS_URL: redis://localhost:6379
      JWT_SECRET: ci-test-secret-must-be-at-least-32-characters-long
      ENCRYPTION_KEY: "0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef"
      NODE_ENV: test

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run migrate

      - name: Seed test user
        run: node scripts/seed_ci.js

      - name: Start API server
        run: npm run dev &
      - run: npx wait-on http://localhost:3000/health --timeout 60000

      - name: Start UI server
        working-directory: src/ui
        run: npx vite --port 5173 &
      - run: npx wait-on http://localhost:5173 --timeout 60000

      - name: Run Playwright (headless, no screenshots)
        run: npx playwright test --reporter=list
        env:
          CI: "true"

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-traces-fast
          path: |
            test-results/**/trace.zip
            test-results/**/*.png
          retention-days: 7

  # ─── E2E Evidence: headed, screenshots + video, main + nightly ─────────────
  e2e-evidence:
    name: E2E (headed, screenshots)
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || github.event_name == 'schedule'
    needs: ci

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: uros_test
          POSTGRES_PASSWORD: uros_test
          POSTGRES_DB: uros_test
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U uros_test -d uros_test"
          --health-interval 10s --health-timeout 5s --health-retries 5
      redis:
        image: redis:7-alpine
        ports: [6379:6379]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s --health-timeout 5s --health-retries 5
      mailpit:
        image: axllent/mailpit:latest
        ports: [1025:1025, 8025:8025]
        options: >-
          --health-cmd "wget -q -O- http://localhost:8025/api/v1/info || exit 1"
          --health-interval 5s --health-timeout 5s --health-retries 10

    env:
      DATABASE_URL: postgres://uros_test:uros_test@localhost:5432/uros_test
      REDIS_URL: redis://localhost:6379
      JWT_SECRET: ci-test-secret-must-be-at-least-32-characters-long
      ENCRYPTION_KEY: "0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef"
      NODE_ENV: test

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run migrate

      - name: Seed test user
        run: node scripts/seed_ci.js

      - name: Start API server
        run: npm run dev &
      - run: npx wait-on http://localhost:3000/health --timeout 60000

      - name: Start UI server
        working-directory: src/ui
        run: npx vite --port 5173 &
      - run: npx wait-on http://localhost:5173 --timeout 60000

      - name: Run Playwright (headed via xvfb, screenshots + video)
        run: xvfb-run --auto-servernum npx playwright test --reporter=list --timeout=120000
        env:
          CI: "true"

      - name: Run screenshot curator
        timeout-minutes: 15
        run: xvfb-run --auto-servernum npx playwright test --config=playwright.curator.config.ts --reporter=list
        env:
          CI: "true"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-evidence-screenshots
          path: docs/e2e-evidence/quest-05/e2e/*.png
          retention-days: 30

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-traces-evidence
          path: |
            test-results/**/trace.zip
            test-results/**/*.webm
            test-results/**/*.png
          retention-days: 14
