# Quest 01: Deploy workflow — real build, GHCR push, migrate, deploy.
#
# Triggered on push to main or manual dispatch. Builds API + UI images,
# pushes to GHCR, runs migrations, then deploys via deploy/cloud_run_deploy.sh.
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      environment:
        description: "Target environment"
        required: true
        default: "staging"
        type: choice
        options: [staging, production]

concurrency:
  group: deploy-${{ github.ref }}-${{ inputs.environment || 'staging' }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_API: ghcr.io/${{ github.repository }}/uros-api
  IMAGE_UI: ghcr.io/${{ github.repository }}/uros-ui

jobs:
  build-and-push:
    name: Build & Push Images
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image_tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - id: tag
        run: echo "tag=${{ github.sha }}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push API image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: deploy/docker/Dockerfile.api
          push: true
          tags: |
            ${{ env.IMAGE_API }}:${{ steps.tag.outputs.tag }}
            ${{ env.IMAGE_API }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build & push UI image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: deploy/docker/Dockerfile.ui
          push: true
          tags: |
            ${{ env.IMAGE_UI }}:${{ steps.tag.outputs.tag }}
            ${{ env.IMAGE_UI }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  migrate:
    name: Run Migrations (${{ inputs.environment || 'staging' }})
    needs: build-and-push
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment || 'staging' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "20", cache: "npm" }
      - run: npm ci --omit=dev
      - name: Run migrations
        run: npm run migrate
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

  deploy:
    name: Deploy to ${{ inputs.environment || 'staging' }}
    needs: [build-and-push, migrate]
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment || 'staging' }}
    outputs:
      deployed_tag: ${{ needs.build-and-push.outputs.image_tag }}
    steps:
      - uses: actions/checkout@v4

      - name: Authenticate Google Cloud
        if: ${{ secrets.GCP_SA_KEY != '' }}
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        if: ${{ secrets.GCP_SA_KEY != '' }}
        uses: google-github-actions/setup-gcloud@v2

      - name: Deploy via script
        run: |
          chmod +x deploy/cloud_run_deploy.sh
          bash deploy/cloud_run_deploy.sh
        env:
          IMAGE_TAG: ${{ needs.build-and-push.outputs.image_tag }}
          GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
          GCP_REGION: ${{ secrets.GCP_REGION }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          ENVIRONMENT: ${{ inputs.environment || 'staging' }}

      - name: Record deployed tag
        run: |
          mkdir -p deploy-history
          echo "$(date -u +%Y-%m-%dT%H:%M:%SZ) ${{ inputs.environment || 'staging' }} ${{ needs.build-and-push.outputs.image_tag }}" >> deploy-history/${{ inputs.environment || 'staging' }}.log

      - uses: actions/upload-artifact@v4
        with:
          name: deploy-history-${{ inputs.environment || 'staging' }}
          path: deploy-history/${{ inputs.environment || 'staging' }}.log
          retention-days: 90
